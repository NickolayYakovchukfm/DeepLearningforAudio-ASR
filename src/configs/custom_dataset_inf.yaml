defaults:
  - model: conformer
  - metrics: target_metrics
  - datasets: custom_dir_dataset_conf # we do not want to run inference on training data
  - dataloader: example
  - transforms: example_only_instance_inf
  - _self_
text_encoder:
  _target_: src.text_encoder.CTCTextEncoder
  lm_inf_path: "language_models/4gram_lowercase.arpa"
inferencer:
  device_tensors: ["spectrogram", "text_encoded"] # which tensors should be on device (ex. GPU)
  device: auto # device name or "auto"
  save_path: "data/saved/inf_results" # any name here, can be a dataset name
  seed: 1
  from_pretrained: "conformer_30m/checkpoint-epoch84.pth" # path to the pretrained model
